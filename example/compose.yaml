services:
###> mysql ###
  # The sample application connects to MySQL from the host, so the port is published.
  # The ${NAME_PORT:-N} form lets bin/worktree.sh pick a free port, so several worktrees
  # can run side by side. No container_name, for the same reason.
  database:
    image: mysql:${MYSQL_VERSION:-8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP", "-uroot", "-p${MYSQL_PASSWORD:-root}"]
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - database_data:/var/lib/mysql:rw
###< mysql ###

volumes:
###> mysql ###
  database_data:
###< mysql ###